<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadê o ônibus?</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #ddd;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.app {
  width: 360px;
  background: #f5f5f5;
  border-radius: 8px;
  overflow: hidden;
}

/* HEADER */
.header {
  background: #f2d65c;
  padding: 10px;
}

.header-top {
  font-size: 14px;
  margin-bottom: 5px;
}

.search-bar {
  display: flex;
  align-items: center;
  background: #eee;
  border-radius: 4px;
  padding: 8px;
}

.search-icon {
  width: 20px;
  height: 20px;
  border: 2px solid #000;
  border-radius: 50%;
  position: relative;
  margin-right: 10px;
}

.search-icon::after {
  content: "";
  position: absolute;
  width: 10px;
  height: 2px;
  background: #000;
  bottom: -5px;
  right: -5px;
  transform: rotate(45deg);
}

.search-input {
  border: none;
  background: transparent;
  font-size: 16px;
  width: 100%;
  outline: none;
}

/* MAPA */
.map {
  position: relative;
  height: 600px;
  background: url("https://maps.gstatic.com/tactile/basepage/pegman_sherlock.png") center/cover no-repeat;
}

/* Marcadores */
.marker {
  position: absolute;
  width: 36px;
  height: 36px;
  background: #f2d65c;
  border-radius: 50%;
  border: 2px solid #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

/* exemplo de posições */
.m1 { top: 200px; left: 50px; }
.m2 { top: 210px; left: 90px; }
.m3 { top: 220px; left: 130px; }
.m4 { top: 230px; left: 170px; }
.m5 { top: 240px; left: 210px; }

/* botão flutuante */
.menu-btn {
  position: absolute;
  bottom: 20px;
  left: 20px;
  width: 50px;
  height: 50px;
  background: #2c8c7a;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 24px;
}

</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="header-top">ESQUE</div>
    <div class="search-bar">
      <div class="search-icon"></div>
      <input class="search-input" placeholder="Cadê o ônibus?">
    </div>
  </div>

  <div class="map">
    <div class="marker m1">🚌</div>
    <div class="marker m2">🚌</div>
    <div class="marker m3">🚌</div>
    <div class="marker m4">🚌</div>
    <div class="marker m5">🚌</div>

    <div class="menu-btn">
  <a href="paginainicial.html" style="text-decoration: none; color: inherit;">
    ☰
  </a>
</div>

</div>

</body>
</html>

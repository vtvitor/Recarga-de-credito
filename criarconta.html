<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta</title>
    <style>
        
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        
        .login-container {
            width: 320px;
            height: 560px;
            background-color: #d9d9d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        
        .header-yellow {
            width: 100%;
            height: 50px;
            background-color: #fde876;
            margin-bottom: 50px;
        }

        
        .input-field {
            width: 80%;
            padding: 12px 20px;
            margin-bottom: 25px;
            border: none;
            border-radius: 25px;
            background-color: #e8e8ed;
            font-size: 16px;
            color: #333;
            outline: none;
        }

    
        .login-button {
            width: 100px;
            padding: 8px;
            margin-top: 10px;
            border: none;
            border-radius: 15px;
            background-color: #e8e8ed;
            font-size: 16px;
            cursor: pointer;
            color: #000;
            transition: backgrou 0.3s;
        }

        .login-button:hover {
            background-color: #cfcfd3;
        }

    </style>
</head>
<body>

    <div class="login-container">
        <div class="header-yellow"></div>

        <input type="text" class="input-field" placeholder="CPF">
        <input type="text" class="input-field" placeholder="Email">
        <input type="password" class="input-field" placeholder="Senha">
        <input type="password" class="input-field" placeholder="Confirmar Senha">

        <button class="login-button"><a href="paginainicial.html" style="text-decoration: none; color: inherit;">Criar conta</a></button>

    </div>

</body>
</html>

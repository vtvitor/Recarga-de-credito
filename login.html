<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <style>
        
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        
        .login-container {
            width: 320px;
            height: 560px;
            background-color: #d9d9d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        
        .header-yellow {
            width: 100%;
            height: 50px;
            background-color: #fde876;
            margin-bottom: 50px;
        }

        
        .profile-icon {
            width: 120px;
            height: 120px;
            background-color: #e8e8ed;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 60px;
        }

        .profile-icon svg {
            width: 80px;
            height: 80px;
            fill: #5f6368;
        }

        
        .input-field {
            width: 80%;
            padding: 12px 20px;
            margin-bottom: 25px;
            border: none;
            border-radius: 25px;
            background-color: #e8e8ed;
            font-size: 16px;
            color: #333;
            outline: none;
        }

    
        .login-button {
            width: 80px;
            padding: 8px;
            margin-top: 10px;
            border: none;
            border-radius: 15px;
            background-color: #e8e8ed;
            font-size: 16px;
            cursor: pointer;
            color: #000;
            transition: background 0.3s;
        }

        .login-button:hover {
            background-color: #cfcfd3;
        }

        
        .footer-links {
            margin-top: 40px;
            text-align: center;
        }

        .footer-links a {
            display: block;
            text-decoration: none;
            color: #000;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header-yellow"></div>

        <div class="profile-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>

        <input type="text" class="input-field" placeholder="CPF">
        <input type="password" class="input-field" placeholder="Senha">

        <button class="login-button">Login</button>

        <div class="footer-links">
            <a href="esqueciasenha.html">Esqueci a senha</a>
            <a href="criarconta.html">Criar conta</a>
        </div>
    </div>

</body>
</html>

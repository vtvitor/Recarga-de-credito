<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar carteirinha</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #ddd;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.app {
  width: 360px;
  background: #cfcfcf;
  padding: 20px;
  min-height: 600px;
}

/* Título */
.title {
  text-align: center;
  font-size: 18px;
  margin-bottom: 20px;
}

/* Botões */
.actions {
  display: flex;
  justify-content: space-between;
  margin-bottom: 40px;
}

.btn {
  width: 48%;
  height: 100px;
  background: #9e9e9e;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 10px;
  font-size: 14px;
  cursor: pointer;
}

/* Formulário */
.form-group {
  margin-bottom: 25px;
}

label {
  display: block;
  font-size: 14px;
  margin-bottom: 5px;
}

input {
  width: 100%;
  border: none;
  border-bottom: 2px solid #555;
  background: transparent;
  padding: 5px;
  outline: none;
  font-size: 14px;
}
.menu-btn {
  position: absolute;
  bottom: 350px;
  left: 780px;
  width: 100px;
  height: 50px;
  background: #2c8c7a;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 24px;
}

</style>
</head>
<body>

<div class="app">

  <div class="title">Cadastrar carteirinha</div>

  <div class="actions">
    <div class="btn">cadastrar<br>manualmente</div>
    <div class="btn">LER</div>
  </div>

  <div class="form-group">
    <label>NOME COMPLETO:</label>
    <input type="text">
  </div>

  <div class="form-group">
    <label>NÚMERO DO CPF:</label>
    <input type="text">
  </div>

  <div class="form-group">
    <label>RG</label>
    <input type="text">
  </div>

  <div class="form-group">
    <label>SUB-TIPO DO CARTÃO:</label>
    <input type="text">
  </div>

</div>
 <div class="menu-btn">
  <a href="paginainicial.html" style="text-decoration: none; color: inherit;">
    Voltar
  </a>
</div>

</body>
</html>

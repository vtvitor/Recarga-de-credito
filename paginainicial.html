<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página com Menu Lateral</title>
    <style>
       
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #d9d9d9; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

       
        .app-container {
            width: 320px;
            height: 560px;
            background-color: #d9d9d9;
            position: relative; 
            overflow: hidden; 
            border: 1px solid #ccc;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        
        .header {
            width: 100%;
            height: 50px;
            background-color: #fde876; 
            display: flex;
            justify-content: flex-end; 
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10; 
        }

        
        .menu-icon {
            cursor: pointer;
            padding: 10px 15px;
            margin-right: 5px;
            z-index: 20; 
        }

        .menu-icon div {
            width: 25px;
            height: 3px;
            background-color: #333;
            margin: 4px 0;
            transition: 0.4s; 
        }

        #menu-toggle {
            display: none;
        }

       
        .main-content {
            padding-top: 80px; 
            text-align: center;
            position: relative;
            z-index: 1; 
        }

        .welcome-text {
            font-size: 24px;
            margin-bottom: 50px;
            display: block;
        }

       
        .page-button {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 15px;
            text-decoration: none;
            color: #000;
            background-color: #e8e8ed;
            border-radius: 25px;
            font-size: 18px;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .page-button:hover {
            background-color: #cfcfd3;
        }

        
        .sidebar {
            height: 100%;
            width: 200px; 
            background-color: white;
            position: absolute;
            top: 0;
            right: -200px; 
            z-index: 15; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 60px; 
            transition: 0.5s; 
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
        }

        
        .sidebar-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        
        .profile-icon {
            width: 80px;
            height: 80px;
            background-color: #e8e8ed;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .profile-icon svg {
            width: 50px;
            height: 50px;
            fill: #5f6368;
        }

        .sidebar-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .sidebar-links {
            width: 100%;
            border-top: 1px solid #ccc;
        }

        .sidebar-link {
            display: block;
            text-decoration: none;
            color: #000;
            font-size: 16px;
            padding: 12px 20px;
            border-bottom: 1px solid #ccc;
            text-align: center;
            transition: background 0.2s;
        }

        .sidebar-link:hover {
            background-color: #f0f0f0;
        }

    
        #menu-toggle:checked ~ .sidebar {
            right: 0; 
        }

       
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 12;
            opacity: 0;
            pointer-events: none; 
            transition: 0.5s;
        }

        #menu-toggle:checked ~ .overlay {
            opacity: 1;
            pointer-events: auto; 
        }
        
    </style>
</head>
<body>

    <div class="app-container">
        
        <input type="checkbox" id="menu-toggle">
        
        <div class="header">
            <label for="menu-toggle" class="menu-icon">
                <div></div>
                <div></div>
                <div></div>
            </label>
        </div>

        <label for="menu-toggle" class="overlay"></label>

        <div class="sidebar">
            <div class="sidebar-profile">
                <div class="profile-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div class="sidebar-name">[Nome]</div>
            </div>

            <div class="sidebar-links">
                <a href="#" class="sidebar-link">Recarregar</a>
                <a href="#" class="sidebar-link">Achar ônibus</a>
                <a href="#" class="sidebar-link">Mudar senha</a>
                <a href="#" class="sidebar-link">Cadastrar</a>
            </div>
        </div>

        <div class="main-content">
            <span class="welcome-text">Olá! [Nome]</span>
            <a href="pagamento.html" style="text-decoration: none;">
            <button class="page-button">Recarregar</button>
            </a>
            <a href="esque.html" style="text-decoration: none;">
            <button class="page-button">Achar ônibus</button>
            </a>
            <a href="CadastrarCarteirinha.html" style="text-decoration: none;">
            <button class="page-button">Cadastrar</button>
            </a>
        </div>

    </div>

</body>
</html>
